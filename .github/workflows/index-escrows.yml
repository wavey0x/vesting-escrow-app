name: Index Escrows

on:
  schedule:
    - cron: '0 1-23 * * *' # Lightweight hourly runs, excluding midnight UTC
    - cron: '0 0 * * *'    # Midnight run also refreshes existing token logos
  workflow_dispatch:
    inputs:
      refresh_logos:
        description: Re-check existing token logos
        required: false
        default: false
        type: boolean

concurrency:
  group: index-escrows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count escrows before indexing
        id: before
        run: |
          echo "count=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/data/escrows.json')
          if not path.exists():
              print(0)
          else:
              with path.open() as f:
                  data = json.load(f)
              print(len(data.get('escrows', [])))
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/indexer/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/indexer/requirements.txt

      - name: Run indexer
        env:
          MAINNET_RPC: ${{ secrets.MAINNET_RPC }}
          REFRESH_LOGOS: ${{ github.event.schedule == '0 0 * * *' || inputs.refresh_logos }}
        run: |
          indexer_args=()
          if [[ "$REFRESH_LOGOS" == "true" ]]; then
            indexer_args+=(--refresh-logos)
          fi
          python scripts/indexer/index_escrows.py "${indexer_args[@]}"

      - name: Count escrows after indexing
        id: after
        run: |
          echo "count=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/data/escrows.json')
          if not path.exists():
              print(0)
          else:
              with path.open() as f:
                  data = json.load(f)
              print(len(data.get('escrows', [])))
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Compute new escrow count
        id: delta
        run: |
          before=${{ steps.before.outputs.count }}
          after=${{ steps.after.outputs.count }}
          new_escrows=$((after - before))
          token_metadata_changed=false
          if ! git diff --quiet -- public/data/tokens.json; then
            token_metadata_changed=true
          fi

          if [ "$new_escrows" -gt 0 ]; then
            has_index_changes=true
            commit_message="chore: index $new_escrows new escrow(s) [skip ci]"
          elif [ "$token_metadata_changed" = "true" ]; then
            has_index_changes=true
            commit_message="chore: refresh token metadata [skip ci]"
          else
            has_index_changes=false
            commit_message=""
          fi

          {
            echo "has_index_changes=$has_index_changes"
            echo "new_escrows=$new_escrows"
            echo "token_metadata_changed=$token_metadata_changed"
            echo "commit_message=$commit_message"
          } >> "$GITHUB_OUTPUT"

      - name: Commit updated index
        if: steps.delta.outputs.has_index_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.delta.outputs.commit_message }}
          file_pattern: "public/data/escrows.json public/data/tokens.json"
          commit_author: "GitHub Actions <actions@github.com>"
