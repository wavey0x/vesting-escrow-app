name: App Tests

on:
  push:
    paths:
      - 'config/**'
      - 'src/**'
      - 'scripts/indexer/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/app-test.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'src/**'
      - 'scripts/indexer/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/app-test.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/indexer/requirements.txt
      - run: pip install -r scripts/indexer/requirements.txt
      - run: python -m unittest discover -s scripts/indexer/tests -v
